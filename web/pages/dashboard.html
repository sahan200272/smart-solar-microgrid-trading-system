<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Microgrid Dashboard</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Solar Microgrid Dashboard</h2>
            <p class="text-muted mb-0">
                User & Access Management
            </p>
        </div>
        <button
            class="btn btn-outline-danger"
            onclick="logout()">
            Logout
        </button>
    </div>

    <!-- User information -->
    <div class="card mb-4">
        <div class="card-body">
            <h5>Welcome, <span id="userName"></span></h5>
            <p class="mb-0">
                Role:
                <strong id="userRole"></strong>
            </p>
        </div>
    </div>

    <!-- Management cards -->
    <div class="row g-4">
        <!-- User Management -->
        <div
            class="col-md-6"
            id="userManagementCard">
            <div class="card h-100">
                <div class="card-header">
                    User Management
                </div>
                <div class="card-body">
                    <p>
                        Create and manage Backoffice
                        and Grid Operator accounts.
                    </p>
                    <a
                        href="users.html"
                        class="btn btn-primary">
                        Manage Users
                    </a>
                </div>
            </div>
        </div>

        <!-- Prosumer Management -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header">
                    Prosumer Management
                </div>
                <div class="card-body">
                    <p>
                        View and manage Prosumer accounts.
                    </p>
                    <a
                        href="prosumers.html"
                        class="btn btn-primary">
                        View Prosumers
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/dashboard.js"></script>
</body>
</html>
