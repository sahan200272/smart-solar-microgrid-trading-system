<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>User Management</h2>
        <a
            href="dashboard.html"
            class="btn btn-outline-secondary">
            Dashboard
        </a>
    </div>

    <!-- Create User -->
    <div class="card mb-4">
        <div class="card-header">
            Create New User
        </div>
        <div class="card-body">
            <div class="row g-2">
                <div class="col-md-6">
                    <button
                        class="btn btn-primary w-100"
                        onclick="openCreateModal('Backoffice')">
                        Create Backoffice User
                    </button>
                </div>
                <div class="col-md-6">
                    <button
                        class="btn btn-primary w-100"
                        onclick="openCreateModal('GridOperator')">
                        Create Grid Operator
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Users -->
    <div class="card">
        <div class="card-header d-flex justify-content-between">
            <span>All Users</span>
            <button
                id="refreshBtn"
                class="btn btn-sm btn-outline-secondary">
                Refresh
            </button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>NIC</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Create User Modal -->
<div class="modal fade" id="createUserModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5
                    class="modal-title"
                    id="createModalTitle">
                    Create User
                </h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>
            </div>
            <div class="modal-body">
                <input
                    type="hidden"
                    id="createRole">
                <div class="mb-2">
                    <label class="form-label">
                        NIC
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="createNIC"
                        required>
                </div>
                <div class="mb-2">
                    <label class="form-label">
                        Full Name
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="createFullName"
                        required>
                </div>
                <div class="mb-2">
                    <label class="form-label">
                        Email
                    </label>
                    <input
                        type="email"
                        class="form-control"
                        id="createEmail">
                </div>
                <div class="mb-2">
                    <label class="form-label">
                        Phone
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="createPhone">
                </div>
                <div class="mb-2">
                    <label class="form-label">
                        Password
                    </label>
                    <input
                        type="password"
                        class="form-control"
                        id="createPassword"
                        required>
                </div>
            </div>
            <div class="modal-footer">
                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancel
                </button>
                <button
                    class="btn btn-primary"
                    id="createUserBtn">
                    Create User
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Edit User Modal -->
<div class="modal fade" id="editUserModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    Edit User
                </h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>
            </div>
            <div class="modal-body">
                <input
                    type="hidden"
                    id="editUserId">
                <div class="mb-2">
                    <label class="form-label">
                        Full Name
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="editFullName">
                </div>
                <div class="mb-2">
                    <label class="form-label">
                        Email
                    </label>
                    <input
                        type="email"
                        class="form-control"
                        id="editEmail">
                </div>
                <div class="mb-2">
                    <label class="form-label">
                        Phone
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="editPhone">
                </div>
                <div class="mb-2">
                    <label class="form-label">
                        Address
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="editAddress">
                </div>
                <div class="mb-2">
                    <label class="form-label">
                        Status
                    </label>
                    <select
                        class="form-select"
                        id="editStatus">
                        <option value="Active">
                            Active
                        </option>
                        <option value="Pending">
                            Pending
                        </option>
                        <option value="Deactivated">
                            Deactivated
                        </option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancel
                </button>
                <button
                    class="btn btn-primary"
                    id="saveEditBtn">
                    Save Changes
                </button>
            </div>
        </div>
    </div>
</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<script src="../js/config.js"></script>
<script src="../js/users.js"></script>
</body>
</html>
