<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Prosumer Management</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Prosumer Management</h2>
        <a
            href="dashboard.html"
            class="btn btn-outline-secondary">
            Dashboard
        </a>
    </div>
    <div class="card">
        <div class="card-header d-flex justify-content-between">
            <span>All Prosumers</span>
            <button
                id="refreshBtn"
                class="btn btn-sm btn-outline-secondary">
                Refresh
            </button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>NIC</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="prosumersTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="card mt-4">
        <div class="card-header d-flex justify-content-between">
            <span>Pending Activations</span>
            <button
                id="refreshPendingBtn"
                class="btn btn-sm btn-outline-secondary">
                Refresh
            </button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>NIC</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="pendingProsumersTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/prosumers.js"></script>
</body>
</html>
