<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microgrid Node Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4">Microgrid Node Management</h2>

    <!-- Create Node Form -->
    <div class="card mb-4">
        <div class="card-header">Create New Node</div>
        <div class="card-body">
            <form id="createNodeForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Station Name</label>
                        <input type="text" class="form-control" id="stationName" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Latitude</label>
                        <input type="number" step="any" class="form-control" id="latitude" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Longitude</label>
                        <input type="number" step="any" class="form-control" id="longitude" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Capacity (kW/h)</label>
                        <input type="number" step="any" class="form-control" id="capacityKWh" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Total Battery Slots</label>
                        <input type="number" class="form-control" id="totalBatterySlots" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Operating Schedule</label>
                        <input type="text" class="form-control" id="operatingSchedule" placeholder="e.g. 06:00 - 22:00" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Create Node</button>
            </form>
        </div>
    </div>

    <!-- Node List -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>All Nodes</span>
            <button id="refreshBtn" class="btn btn-sm btn-outline-secondary">Refresh</button>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Station Name</th>
                        <th>Capacity (kW/h)</th>
                        <th>Slots (Avail/Total)</th>
                        <th>Schedule</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="nodesTableBody">
                    <!-- Populated dynamically by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Node</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editNodeId">
                <div class="mb-2">
                    <label class="form-label">Station Name</label>
                    <input type="text" class="form-control" id="editStationName">
                </div>
                <div class="mb-2">
                    <label class="form-label">Latitude</label>
                    <input type="number" step="any" class="form-control" id="editLatitude">
                </div>
                <div class="mb-2">
                    <label class="form-label">Longitude</label>
                    <input type="number" step="any" class="form-control" id="editLongitude">
                </div>
                <div class="mb-2">
                    <label class="form-label">Capacity (kW/h)</label>
                    <input type="number" step="any" class="form-control" id="editCapacityKWh">
                </div>
                <div class="mb-2">
                    <label class="form-label">Total Battery Slots</label>
                    <input type="number" class="form-control" id="editTotalBatterySlots">
                </div>
                <div class="mb-2">
                    <label class="form-label">Operating Schedule</label>
                    <input type="text" class="form-control" id="editOperatingSchedule">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveEditBtn">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/nodes.js"></script>
</body>
</html>
